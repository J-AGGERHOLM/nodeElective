<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 3. CSS file-->
    <link rel="styleSheet" href="./frontpage/frontpage.css">

    <!---- 2. CSS in HTML file head -->
    <style>
      .frontPage-sub-title {
        color: blue;
      }
    </style>
    <title>FrontPage</title>
  </head>
  <body>
    <!-- 1. inline CSS -->
    <h1 style="color: aqua">Welcome to my website</h1>

    <h3 class="frontPage-sub-tite">I hope you enjoy it</h3>
    <h2 id="guest-book-counter">0</h2>
    <button id="guest-book-btn" onclick="incrementCounter()">
      add your visit to the counter
    </button>

    <script src="./frontpage/frontpage.js"></script>

    <script>
      const guestBookCounter = document.getElementById("guest-book-counter");
      let guestBookCounterValue = 0;

      function incrementCounter() {
        guestBookCounter.textContent = ++guestBookCounterValue;
      }
    </script>
  </body>
</html>
